repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: bash -c 'cd server && python -m flake8 src/ tests/'
        language: system
        types: [python]
        pass_filenames: false

      - id: pylint
        name: pylint
        entry: bash -c 'cd server && python -m pylint src/ --indent-string="  "'
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: bash -c 'cd server && python -m mypy src/'
        language: system
        types: [python]
        pass_filenames: false

      - id: eslint
        name: eslint
        entry: bash -c 'cd client && npm run lint'
        language: system
        types: [javascript]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: bash -c 'cd server && python -m pytest tests/ -q'
        language: system
        types: [python]
        pass_filenames: false

      - id: vitest
        name: vitest
        entry: bash -c 'cd client && npm test'
        language: system
        types: [javascript]
        pass_filenames: false
