[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pylint.format]
indent-string = "  "
max-line-length = 80

[tool.pylint.messages_control]
extension-pkg-whitelist = "cv2"
generated-members = "cv2.*"
disable = [
  "broad-exception-caught",
  "broad-exception-raised",
  "unused-argument",
]

[tool.flake8]
max-line-length = 80
indent-size = 2

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
