[project]
name = "webrtc-server"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "aiortc>=1.14.0",
  "aiohttp>=3.9.0",
  "opencv-python-headless>=4.8.0",
  "numpy>=1.24.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "flake8>=7.0.0",
  "pylint>=3.0.0",
  "mypy>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pylint.format]
indent-string = "  "
max-line-length = 80

[tool.pylint.messages_control]
extension-pkg-whitelist = "cv2"
generated-members = "cv2.*"
disable = [
  "broad-exception-caught",
  "broad-exception-raised",
  "unused-argument",
]

[tool.flake8]
max-line-length = 80
indent-size = 2

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
