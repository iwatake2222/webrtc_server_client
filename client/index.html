<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Client</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .video-container video {
      max-width: 100%;
      height: auto;
      background-color: #000;
    }
    .stats-display {
      font-family: monospace;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">WebRTC Client</h1>

    <!-- Server URL and Connection Controls -->
    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-3 align-items-center">
          <div class="col-md-6">
            <label for="serverUrl" class="form-label">Server URL</label>
            <input type="text" class="form-control" id="serverUrl"
                   placeholder="ws://localhost:8080/ws">
          </div>
          <div class="col-md-2">
            <label for="cameraSelect" class="form-label">Camera</label>
            <select class="form-select" id="cameraSelect">
              <option value="">Loading...</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="resolution" class="form-label">Resolution</label>
            <select class="form-select" id="resolution">
              <option value="1920x1080">1920x1080 (Full HD)</option>
              <option value="1280x720">1280x720 (HD)</option>
              <option value="640x480" selected>640x480 (VGA)</option>
              <option value="320x240">320x240 (QVGA)</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="codecSelect" class="form-label">Codec</label>
            <select class="form-select" id="codecSelect">
              <option value="vp8" selected>VP8</option>
              <option value="h264">H.264</option>
              <option value="vp9">VP9</option>
            </select>
          </div>
          <div class="col-md-2 d-flex gap-2 align-items-end">
            <button id="connectBtn" class="btn btn-primary flex-fill">Connect</button>
            <button id="disconnectBtn" class="btn btn-secondary flex-fill" disabled>Disconnect</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Local Video -->
    <div class="card mb-3">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Local Camera</span>
        <button class="btn btn-sm btn-outline-secondary" type="button"
                data-bs-toggle="collapse" data-bs-target="#localVideoCollapse"
                aria-expanded="true" aria-controls="localVideoCollapse">
          Toggle
        </button>
      </div>
      <div class="collapse show" id="localVideoCollapse">
        <div class="card-body video-container">
          <video id="localVideo" autoplay playsinline muted></video>
        </div>
      </div>
    </div>

    <!-- Remote Video -->
    <div class="card mb-3">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Remote Video (Server Processed)</span>
        <button class="btn btn-sm btn-outline-secondary" type="button"
                data-bs-toggle="collapse" data-bs-target="#remoteVideoCollapse"
                aria-expanded="true" aria-controls="remoteVideoCollapse">
          Toggle
        </button>
      </div>
      <div class="collapse show" id="remoteVideoCollapse">
        <div class="card-body video-container">
          <video id="remoteVideo" autoplay playsinline></video>
        </div>
      </div>
    </div>

    <!-- Statistics -->
    <div class="card mb-3">
      <div class="card-header">Statistics (current / 10s avg)</div>
      <div class="card-body stats-display">
        <div class="row">
          <div class="col-md-6">
            <p class="mb-1">Camera FPS: <span id="statsCameraFps">-- / --</span> fps</p>
            <p class="mb-1">Camera Resolution: <span id="statsCameraResolution">--</span></p>
            <p class="mb-1">Latency (RTT): <span id="statsLatency">-- / --</span> ms</p>
          </div>
          <div class="col-md-6">
            <p class="mb-1">Server FPS: <span id="statsFps">-- / --</span> fps</p>
            <p class="mb-1">Server Resolution: <span id="statsResolution">--</span></p>
            <p class="mb-1">Processing Time: <span id="statsProcessingTime">-- / --</span> ms</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Server Response Text -->
    <div class="card mb-3">
      <div class="card-header">Server Response</div>
      <div class="card-body">
        <pre id="serverResponse" class="mb-0 text-muted">No response yet.</pre>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
