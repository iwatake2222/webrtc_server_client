name: Server Tests

on:
  pull_request:
    paths:
      - 'server/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv && uv sync
      - run: |
          source .venv/bin/activate
          flake8 src/ tests/
          pylint src/
          mypy src/
          pytest -v
